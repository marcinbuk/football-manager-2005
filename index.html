<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Football Manager 2005</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0f14;
      color: #e6edf3;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }
    iframe {
      display: block;
      width: 100vw;
      height: 100vh;
      border: 0;
      background: #0b0f14;
    }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at top, #132230 0%, #0b0f14 70%);
    }
    .card {
      width: 100%;
      max-width: 440px;
      background: #131a22;
      border: 1px solid #253242;
      border-radius: 16px;
      padding: 26px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.55);
    }
    .card h1 {
      margin: 0 0 8px;
      font-size: 1.4rem;
    }
    .card p {
      margin: 0 0 18px;
      color: #8b9bb0;
      font-size: 0.94rem;
      line-height: 1.45;
    }
    .field-label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #cbd5e1;
    }
    input[type="text"] {
      width: 100%;
      padding: 11px 13px;
      border-radius: 10px;
      border: 1px solid #2d3d52;
      background: #0b0f14;
      color: #e6edf3;
      font-size: 1rem;
      outline: none;
      margin-bottom: 12px;
    }
    input[type="text"]:focus {
      border-color: #22c55e;
    }
    .btn-row {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-main {
      width: 100%;
      padding: 11px 16px;
      border: 0;
      border-radius: 10px;
      font-size: 0.96rem;
      font-weight: 700;
      cursor: pointer;
      background: #22c55e;
      color: #04130a;
    }
    .btn-main:hover { background: #16a34a; }
    .btn-guest {
      width: 100%;
      padding: 10px 16px;
      border: 1px solid #334155;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      background: #1e293b;
      color: #e6edf3;
    }
    .btn-guest:hover { background: #293548; }
    .msg {
      margin-top: 14px;
      font-size: 0.88rem;
      color: #93c5fd;
      min-height: 1.2em;
    }
    .msg.error { color: #fca5a5; }
    .pill {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(11, 15, 20, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.16);
      backdrop-filter: blur(6px);
      color: #e6edf3;
      font-size: 13px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.45);
    }
    .pill.collapsed { padding: 5px 9px; }
    .pill-user {
      font-weight: 700;
      color: #4ade80;
      padding: 0 4px;
      white-space: nowrap;
    }
    .pill a, .pill button {
      border: 0;
      background: rgba(255, 255, 255, 0.1);
      color: #e6edf3;
      padding: 4px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      line-height: 1.3;
      white-space: nowrap;
    }
    .pill a:hover, .pill button:hover {
      background: rgba(34, 197, 94, 0.35);
    }
    .pill .icon-btn {
      background: transparent;
      padding: 2px 6px;
      font-size: 14px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="launcher" class="overlay">
    <div class="card">
      <h1>⚽ Football Manager 2005</h1>
      <p>
        Każdy gracz dostaje własne okno gry i osobny folder zapisów.
        Wpisz swój nick (żeby wracać do swoich zapisów nawet z innego urządzenia) albo wejdź jako gość.
      </p>
      <form id="profileForm" onsubmit="submitNick(event)">
        <label class="field-label" for="nickInput">Twój nick (2–24 znaki: litery, cyfry, - lub _)</label>
        <input
          id="nickInput"
          type="text"
          placeholder="np. marcin"
          autocomplete="username"
          minlength="2"
          maxlength="24"
        />
        <div class="btn-row">
          <button type="submit" class="btn-main">Wejdź do gry</button>
          <button type="button" class="btn-guest" onclick="enterAsGuest()">Wejdź szybko jako Gość</button>
        </div>
      </form>
      <div id="launchMsg" class="msg"></div>
    </div>
  </div>

  <iframe id="gameFrame" src="about:blank" allow="fullscreen" title="Football Manager 2005"></iframe>

  <div id="pill" class="pill hidden">
    <button id="expandBtn" class="icon-btn hidden" title="Pokaż pasek" onclick="togglePill(false)">⚽</button>
    <div id="pillControls" style="display:flex;align-items:center;gap:6px;">
      <span id="pillUser" class="pill-user"></span>
      <a id="savesLink" href="/saves" target="_blank" rel="noopener">Zapisy</a>
      <button onclick="restartGame()">Restart</button>
      <button onclick="toggleFullscreen()">Pełny ekran</button>
      <button onclick="switchProfile()">Zmień gracza</button>
      <button class="icon-btn" title="Ukryj pasek" onclick="togglePill(true)">×</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'fm2005_profile';
    const PROFILE_RE = /^[a-z0-9_-]{2,24}$/;
    let currentProfile = null;
    let heartbeatTimer = null;

    function normalizeProfile(raw) {
      if (!raw) return null;
      const clean = raw.trim().toLowerCase();
      return PROFILE_RE.test(clean) ? clean : null;
    }

    function setLaunchMessage(text, isError) {
      const el = document.getElementById('launchMsg');
      el.textContent = text || '';
      el.className = isError ? 'msg error' : 'msg';
    }

    function togglePill(collapse) {
      const pill = document.getElementById('pill');
      const controls = document.getElementById('pillControls');
      const expandBtn = document.getElementById('expandBtn');
      if (collapse) {
        pill.classList.add('collapsed');
        controls.classList.add('hidden');
        expandBtn.classList.remove('hidden');
      } else {
        pill.classList.remove('collapsed');
        controls.classList.remove('hidden');
        expandBtn.classList.add('hidden');
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function stopHeartbeat() {
      if (heartbeatTimer) {
        clearInterval(heartbeatTimer);
        heartbeatTimer = null;
      }
    }

    function startHeartbeat(profile) {
      stopHeartbeat();
      heartbeatTimer = setInterval(async () => {
        if (!currentProfile || currentProfile !== profile) return;
        try {
          const res = await fetch('/api/session/heartbeat?profile=' + encodeURIComponent(profile), {
            method: 'POST'
          });
          if (res.ok) {
            const data = await res.json();
            if (data && data.active === false) {
              startSession(profile);
            }
          }
        } catch (_) {}
      }, 30000);
    }

    async function startSession(profile) {
      const clean = normalizeProfile(profile);
      if (!clean) {
        setLaunchMessage('Podaj poprawny nick: 2-24 znaki (litery a-z, cyfry 0-9, - lub _).', true);
        return;
      }

      document.getElementById('launcher').classList.remove('hidden');
      setLaunchMessage('Uruchamianie Twojej sesji FM 2005 (' + clean + ')...', false);

      try {
        const res = await fetch('/api/session/start?profile=' + encodeURIComponent(clean), {
          method: 'POST'
        });
        const data = await res.json();
        if (!res.ok) {
          if (res.status === 400) {
            localStorage.removeItem(STORAGE_KEY);
          }
          throw new Error(data.error || 'Błąd uruchamiania sesji');
        }

        currentProfile = clean;
        localStorage.setItem(STORAGE_KEY, clean);

        document.getElementById('pillUser').textContent = '👤 ' + clean;
        document.getElementById('savesLink').href = '/saves?profile=' + encodeURIComponent(clean);
        document.getElementById('pill').classList.remove('hidden');
        document.getElementById('launcher').classList.add('hidden');

        const vncUrl =
          '/novnc/vnc.html?autoconnect=true&resize=scale&reconnect=true&reconnect_delay=2000&path=ws/' +
          encodeURIComponent(String(data.ws_port));
        document.getElementById('gameFrame').src = vncUrl;

        startHeartbeat(clean);
      } catch (err) {
        setLaunchMessage(err.message, true);
      }
    }

    function submitNick(event) {
      event.preventDefault();
      const input = document.getElementById('nickInput');
      startSession(input.value);
    }

    function enterAsGuest() {
      const chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
      let suffix = '';
      for (let i = 0; i < 6; i++) {
        suffix += chars[Math.floor(Math.random() * chars.length)];
      }
      startSession('gosc-' + suffix);
    }

    async function restartGame() {
      if (!currentProfile) return;
      if (!confirm('Uruchomić ponownie Twoją grę FM 2005? Niezapisany postęp zostanie utracony.')) {
        return;
      }
      try {
        await fetch('/api/restart?profile=' + encodeURIComponent(currentProfile), { method: 'POST' });
      } catch (_) {}
    }

    async function switchProfile() {
      if (!confirm('Wyjść z bieżącej sesji i zmienić gracza? Twoje zapisane stany gry (.fm) pozostaną bezpieczne na serwerze.')) {
        return;
      }
      const oldProfile = currentProfile;
      currentProfile = null;
      stopHeartbeat();
      localStorage.removeItem(STORAGE_KEY);
      if (window.location.search) {
        window.history.replaceState({}, document.title, '/');
      }
      document.getElementById('gameFrame').src = 'about:blank';
      document.getElementById('pill').classList.add('hidden');
      document.getElementById('nickInput').value = '';
      setLaunchMessage('', false);
      document.getElementById('launcher').classList.remove('hidden');
      if (oldProfile) {
        try {
          await fetch('/api/session/stop?profile=' + encodeURIComponent(oldProfile), { method: 'POST' });
        } catch (_) {}
      }
    }

    (function init() {
      const params = new URLSearchParams(window.location.search);
      const urlProfile = normalizeProfile(params.get('profile'));
      const savedProfile = normalizeProfile(localStorage.getItem(STORAGE_KEY));
      const initial = urlProfile || savedProfile;
      if (initial) {
        document.getElementById('nickInput').value = initial;
        startSession(initial);
      }
    })();
  </script>
</body>
</html>
